<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#065CBE"><title>Mercado de Trabalho | App Inatel</title>
<style>
:root{--blue:#065cbe;--ink:#172e4b;--muted:#5b6b80;--line:#dbe3ee;--bg:#f3f6fb;--soft:#eaf2ff;--green:#146b50}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:16px/1.5 Arial,Helvetica,sans-serif}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}a{color:var(--blue)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #edaa20;outline-offset:3px}button{border:0}header{background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.top{max-width:1240px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:15px 30px;gap:12px}.brand{font-size:27px;font-weight:800;letter-spacing:-1.4px;color:var(--blue)}.brand small{display:block;font-size:10px;letter-spacing:1.3px;font-weight:normal;color:var(--muted)}.demo{font-size:12px;background:var(--soft);padding:6px 10px;border-radius:30px;color:var(--blue)}.shell{max-width:1240px;margin:auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:45px;padding:32px 30px 100px}.sidebar{position:sticky;top:112px;height:fit-content}.navbtn{background:transparent;width:100%;text-align:left;padding:14px 16px;border-radius:12px;color:var(--muted);margin-bottom:7px;font-size:14px}.navbtn.active{background:var(--blue);color:white;font-weight:700}.navbtn span{margin-right:10px}.sidebar p{font-size:12px;color:var(--muted);padding:16px}.content{max-width:850px;min-width:0}.eyebrow{font-size:11px;letter-spacing:1.7px;text-transform:uppercase;color:var(--blue);font-weight:700;margin:0 0 8px}h1{font-size:32px;line-height:1.18;letter-spacing:-.8px;margin:0 0 12px}h2{font-size:21px;line-height:1.3;margin:0 0 12px}h3{font-size:18px;margin:0 0 5px}p{margin:0 0 16px}.sub{color:var(--muted)}.hero{background:var(--blue);color:white;border-radius:22px;padding:30px;margin-bottom:28px;position:relative;overflow:hidden}.hero:after{content:'';position:absolute;width:160px;height:160px;border:35px solid #ffffff10;border-radius:50%;right:-65px;bottom:-80px;pointer-events:none}.hero .eyebrow{color:#cfe3ff}.hero p{max-width:470px;color:#e3efff}.hero .btn{background:white;color:var(--blue)}.panel,.card{background:white;border:1px solid var(--line);border-radius:17px;padding:24px;margin-bottom:16px}.panel h2{margin-top:0}.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.row.wrap{flex-wrap:wrap}.company{display:flex;gap:14px;align-items:center;margin-bottom:17px}.monogram{background:var(--soft);color:var(--blue);width:46px;height:46px;display:grid;place-items:center;border:1px solid #cddff8;border-radius:12px;font-size:17px;font-weight:700;flex-shrink:0}.company p{margin:0;font-size:13px;color:var(--muted)}.tag{display:inline-block;font-size:12px;padding:5px 10px;border-radius:7px;background:var(--bg);color:var(--muted);margin:0 5px 6px 0}.status{color:var(--green);background:#e6f5ee}.status.cancel{color:#7c4a32;background:#fbefe5}.meta{font-size:13px;color:var(--muted)}.btn{display:inline-flex;justify-content:center;align-items:center;min-height:46px;gap:9px;padding:11px 19px;background:var(--blue);color:white;border-radius:10px;font-size:14px;font-weight:700;text-decoration:none}.btn.secondary{background:white;color:var(--blue);border:1px solid #c8d9ee}.btn.danger{color:#9d3030;background:#fff3f3;border:1px solid #e9c1c1}.btn.full{width:100%}.textbtn{background:transparent;color:var(--blue);padding:10px 0;font-size:14px}.back{margin-bottom:18px}.field{margin-bottom:18px}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}input:not([type=checkbox]),select{border:1px solid #b9c9dc;border-radius:10px;background:white;color:var(--ink);min-height:48px;padding:10px 13px;width:100%;min-width:0}input[type=file]{font-size:13px}input[type=checkbox]{width:19px;height:19px;flex-shrink:0}.search{display:flex;gap:9px;margin-bottom:15px}.search input{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.stat{font-size:24px;color:var(--blue);font-weight:700}.divider{border:0;border-top:1px solid var(--line);margin:20px 0}.notice{background:var(--soft);border-left:3px solid var(--blue);border-radius:7px;padding:14px 16px;font-size:13px;margin:18px 0}.notice.error{background:#fff2f0;border-color:#ad3026;color:#8c2620}.hint{font-size:12px;color:var(--muted);margin:7px 0}.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:normal}.check a{color:var(--blue)}.steps{display:flex;gap:8px;margin-bottom:26px}.step{height:4px;background:var(--line);flex:1;border-radius:5px}.step.on{background:var(--blue)}.success{width:68px;height:68px;display:grid;place-items:center;color:var(--green);background:#e6f5ee;font-size:32px;border-radius:50%;margin-bottom:20px}.center{text-align:center}.center .success{margin:0 auto 20px}.timeline{border-left:2px solid var(--line);margin:22px 0 22px 9px;padding-left:23px}.timeline p{position:relative}.timeline p:before{content:'';position:absolute;left:-30px;top:7px;width:10px;height:10px;background:var(--blue);border-radius:50%}.mobile-nav{display:none}.empty{padding:30px 20px;text-align:center}.empty .symbol{font-size:38px;color:var(--blue)}.service{background:white;border:1px solid var(--line);text-align:left;padding:24px;border-radius:17px;color:var(--ink)}.service strong{font-size:18px;display:block;margin-bottom:7px}.service span{font-size:14px;color:var(--muted)}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);padding:12px 20px;color:white;background:#17324d;border-radius:10px;z-index:30;box-shadow:0 4px 20px #17324d30;font-size:14px;max-width:90vw}.support{font-size:12px;color:var(--muted);padding:25px 0}.modalwrap{position:fixed;inset:0;background:#102a4380;display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.modal{background:white;border-radius:20px;padding:28px;width:100%;max-width:440px;box-shadow:0 20px 60px #102a4340}.modal .btn{margin-top:10px}.screen{animation:appear .18s ease}@keyframes appear{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.screen{animation:none}}@media(max-width:800px){.shell{display:block;padding:24px 18px 100px}.sidebar{display:none}.top{padding:13px 18px}.mobile-nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:flex;padding:7px 8px max(8px,env(safe-area-inset-bottom));z-index:10}.mobile-nav button{background:white;color:var(--muted);font-size:11px;flex:1;min-height:49px;border-radius:8px}.mobile-nav button.active{color:var(--blue);background:var(--soft);font-weight:700}.mobile-nav b{font-size:20px;display:block;line-height:1.1;margin-bottom:3px}h1{font-size:28px}.hero{padding:25px 23px;border-radius:18px}.panel,.card{padding:20px}.content{max-width:620px;margin:auto}.grid{gap:12px}.grid.single-mobile{grid-template-columns:1fr}.row.stack-mobile{align-items:flex-start;flex-direction:column}.row.stack-mobile .btn{width:100%}.demo{font-size:10px}.search .btn{padding:10px 14px}}@media(max-width:360px){.shell{padding-left:12px;padding-right:12px}.panel,.card{padding:16px}.brand{font-size:23px}h1{font-size:25px}.grid{grid-template-columns:1fr}}
</style></head><body><header><div class="top"><div class="brand">inatel<small>APP DO ALUNO</small></div><span class="demo">Protótipo acadêmico · demonstração</span></div></header><div class="shell"><aside class="sidebar" aria-label="Navegação principal"></aside><main class="content" id="app"></main></div><nav class="mobile-nav" aria-label="Navegação inferior"></nav><div id="toast" role="status" aria-live="polite"></div><div id="modal"></div>
<script>
'use strict';
const jobs=[{id:1,title:'Estágio em desenvolvimento',company:'Empresa Alfa',initial:'AL',type:'Estágio',mode:'Híbrido',local:'Santa Rita do Sapucaí',area:'Software',pay:'R$ 1.500 / mês',hours:'30 horas semanais',deadline:'30/11/2026',active:true,desc:'Participe do desenvolvimento de aplicações web, colabore com o time de produto e aprenda com profissionais de tecnologia.',req:['Estar cursando Engenharia de Software ou área relacionada','Conhecimento de lógica de programação e JavaScript','Disponibilidade para 30 horas semanais'],benefits:'Bolsa-auxílio, vale-transporte e mentoria técnica.'},{id:2,title:'Desenvolvedor(a) júnior',company:'Empresa Beta',initial:'BE',type:'Emprego',mode:'Remoto',local:'Brasil',area:'Software',pay:'A combinar',hours:'40 horas semanais',deadline:'15/12/2026',active:true,desc:'Desenvolva interfaces e APIs em uma equipe colaborativa, com revisão de código e oportunidades de crescimento.',req:['Fundamentos de desenvolvimento web','Conhecimento de Git e APIs REST','Interesse em aprender com o time'],benefits:'Trabalho remoto, auxílio home office e formação contínua.'},{id:3,title:'Estágio em telecomunicações',company:'Empresa Gama',initial:'GA',type:'Estágio',mode:'Presencial',local:'Santa Rita do Sapucaí',area:'Telecom',pay:'R$ 1.400 / mês',hours:'30 horas semanais',deadline:'25/11/2026',active:true,desc:'Apoie testes de redes e medições de sinais em projetos de telecomunicações.',req:['Cursar Engenharia de Telecomunicações ou área relacionada','Noções de redes de computadores','Disponibilidade presencial'],benefits:'Bolsa-auxílio, alimentação e treinamento.'},{id:4,title:'Assistente de testes',company:'Empresa Alfa',initial:'AL',type:'Emprego',mode:'Híbrido',local:'Santa Rita do Sapucaí',area:'Software',pay:'A combinar',hours:'40 horas semanais',deadline:'01/11/2026',active:false,desc:'Apoio à garantia de qualidade e execução de testes de software.',req:['Fundamentos de testes de software'],benefits:'Alimentação e transporte.'}];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function read(){try{return JSON.parse(localStorage.getItem('inatel-mercado-v1'))||{apps:[],resume:null}}catch{return {apps:[],resume:null}}}
let state=read(),screen='login',jobId=1,query='',filters={type:'',mode:'',local:''},fileError='',showClosed=false,history=[],demoName='',recordId=null;
function save(){try{localStorage.setItem('inatel-mercado-v1',JSON.stringify(state))}catch{notify('Seu navegador não permitiu salvar. Os dados permanecem nesta sessão.')}}
const current=()=>jobs.find(j=>j.id===jobId)||jobs[0],application=id=>state.apps.find(a=>a.job===id&&a.status!=='Cancelada');
function btn(label,action,kind=''){return `<button class="btn ${kind}" ${action}>${label}</button>`}
function back(dest,label='Voltar'){return `<button class="textbtn back" onclick="go('${dest}')">← ${label}</button>`}
function title(k,t,sub=''){return `<p class="eyebrow">${k}</p><h1 tabindex="-1">${t}</h1>${sub?`<p class="sub">${sub}</p>`:''}`}
function company(j){return `<div class="company"><div class="monogram" aria-hidden="true">${j.initial}</div><div><strong>${j.company}</strong><p>${j.area} · Dados demonstrativos</p></div></div>`}
function tags(j){return `<span class="tag">${j.type}</span><span class="tag">${j.mode}</span><span class="tag">${j.local}</span>`}
function go(s,id,appId){recordId=appId||null;if(id)jobId=Number(id);history.push(screen);screen=s;render();window.scrollTo(0,0);document.querySelector('h1')?.focus({preventScroll:true})}
function notify(msg){$('toast').className='toast';$('toast').textContent=msg;clearTimeout(notify.timer);notify.timer=setTimeout(()=>{$('toast').className='';$('toast').textContent=''},4500)}
function nav(){let active=screen==='home'?'home':['apps','status'].includes(screen)?'apps':'jobs';let items=[['home','⌂','Início'],['jobs','▦','Vagas'],['apps','◎','Candidaturas']];document.querySelector('.sidebar').innerHTML=items.map(([s,i,t])=>`<button class="navbtn ${s===active?'active':''}" onclick="go('${s}')"><span aria-hidden="true">${i}</span>${t}</button>`).join('')+'<p>Um próximo passo<br/>para o seu futuro.</p>';document.querySelector('.mobile-nav').innerHTML=items.map(([s,i,t])=>`<button ${s===active?'aria-current="page"':''} class="${s===active?'active':''}" onclick="go('${s}')"><b aria-hidden="true">${i}</b>${t}</button>`).join('');let login=screen==='login';document.querySelector('.sidebar').style.visibility=login?'hidden':'visible';document.querySelector('.mobile-nav').style.visibility=login?'hidden':'visible'}
function render(){nav();let j=current(),a=application(j.id),out='';
if(screen==='login')out=`<div class="hero"><p class="eyebrow">Sua vida no campus</p><h1>Seu futuro começa<br/>com uma conexão.</h1><p>Explore oportunidades e acompanhe suas candidaturas pelo App Inatel.</p></div><section class="panel">${title('Acesso de demonstração','Bem-vindo(a)!','Conheça a experiência completa sem usar uma conta real.')}<form onsubmit="event.preventDefault();demoName=document.getElementById('demo-name').value.trim();go('home')"><div class="field"><label for="demo-name">Como podemos chamar você?</label><input id="demo-name" placeholder="Seu primeiro nome (opcional)" maxlength="30" autocomplete="off"></div>${btn('Entrar na demonstração →','type="submit"','full')}</form><p class="hint">Nenhuma senha ou matrícula real é necessária. Empresas, vagas e candidaturas são simuladas.</p></section>`;
if(screen==='home')out=`${title('App Inatel','Olá, '+esc(demoName||'estudante')+'.','Sua próxima oportunidade pode estar aqui.')}<div class="hero"><p class="eyebrow">Mercado de Trabalho</p><h2>Conecte o que você aprende<br/>ao que quer construir.</h2><p>Encontre estágios e empregos, envie seu currículo e acompanhe cada etapa.</p>${btn('Explorar oportunidades →',"onclick=\"go('jobs')\"")}</div><div class="grid"><div class="panel"><p class="stat">${jobs.filter(j=>j.active).length}</p><p class="meta">oportunidades abertas</p></div><div class="panel"><p class="stat">${state.apps.filter(a=>a.status!=='Cancelada').length}</p><p class="meta">candidaturas ativas</p></div></div><h2>Seus serviços</h2><div class="grid single-mobile"><button class="service" onclick="go('apps')"><strong>◎ Minhas candidaturas</strong><span>Consulte o status das suas inscrições →</span></button><button class="service" onclick="go('resume')"><strong>▤ Meu currículo</strong><span>${state.resume?esc(state.resume.name):'Prepare seu perfil para novas conexões'} →</span></button></div><div class="support">Área acadêmica · Aulas, notas e horários pertencem aos demais módulos do App Inatel.</div>`;
if(screen==='jobs'){let list=jobs.filter(j=>(showClosed||j.active)&&(!query||norm(j.title+' '+j.company+' '+j.local).includes(norm(query)))&&(!filters.type||j.type===filters.type)&&(!filters.mode||j.mode===filters.mode)&&(!filters.local||j.local===filters.local));out=`${title('Carreira e oportunidades','Mercado de Trabalho','Encontre uma oportunidade que combina com você.')}<form class="search" onsubmit="event.preventDefault();runSearch()"><input id="search" aria-label="Buscar cargo, empresa ou cidade" value="${esc(query)}" placeholder="Cargo, empresa ou cidade">${btn('Buscar','type="submit"')}</form><div class="row wrap"><button class="textbtn" onclick="runSearch(true)">☷ Filtrar oportunidades ${Object.values(filters).filter(Boolean).length?`(${Object.values(filters).filter(Boolean).length})`:''}</button><label class="check"><input type="checkbox" ${showClosed?'checked':''} onchange="showClosed=this.checked;render()">Incluir encerradas</label></div><div class="row"><p class="meta" role="status">${list.length} oportunidade${list.length===1?'':'s'} encontrada${list.length===1?'':'s'}</p>${query||Object.values(filters).some(Boolean)?'<button class="textbtn" onclick="clearFilters()">Limpar busca</button>':''}</div>${list.length?list.map(k=>`<article class="card">${company(k)}<h2>${k.title}</h2><p>${tags(k)}</p><div class="row wrap"><span class="meta">${k.active?k.pay:'Inscrições encerradas'}</span>${btn('Ver detalhes →',`onclick="go('detail',${k.id})"`,'secondary')}</div></article>`).join(''):`<div class="panel empty"><p class="symbol" aria-hidden="true">⌕</p><h2>Nenhuma vaga encontrada</h2><p class="sub">Tente outro termo ou ajuste os filtros.</p>${btn('Ajustar filtros',"onclick=\"go('filters')\"")}${btn('Limpar busca',"onclick=\"clearFilters()\"",'secondary')}</div>`}`}
if(screen==='filters')out=`${back('jobs','Voltar às vagas')}${title('Personalize sua busca','Filtrar oportunidades')}<form class="panel" onsubmit="event.preventDefault();applyFilters()">${select('type','Tipo de oportunidade',['Estágio','Emprego'],filters.type)}${select('mode','Modalidade',['Presencial','Híbrido','Remoto'],filters.mode)}${select('local','Localização',['Santa Rita do Sapucaí','Brasil'],filters.local)}<div class="grid">${btn('Limpar filtros','type="button" onclick="clearFilters()"','secondary')}${btn('Aplicar filtros','type="submit"')}</div></form>`;
if(screen==='detail')out=`${back('jobs','Voltar às vagas')}${title(j.type,j.title)}<section class="panel">${company(j)}<p>${tags(j)}</p><div class="grid"><div><p class="meta">Bolsa / remuneração</p><strong>${j.pay}</strong></div><div><p class="meta">Carga horária</p><strong>${j.hours}</strong></div></div><hr class="divider"><h2>Sobre a oportunidade</h2><p>${j.desc}</p><h3>O que você precisa</h3><ul>${j.req.map(r=>`<li>${r}</li>`).join('')}</ul><h3>Benefícios</h3><p>${j.benefits}</p><p class="meta">Prazo de inscrição: ${j.deadline}</p><button class="textbtn" onclick="go('company')">Conhecer a empresa →</button></section>${!j.active?`<div class="notice error"><strong>Inscrições encerradas</strong><br/>Esta oportunidade não recebe novas candidaturas.</div>${btn('Ver outras oportunidades',"onclick=\"go('jobs')\"",'full')}`:a?`<div class="notice">Você já se candidatou a esta vaga.</div>${btn('Acompanhar candidatura',"onclick=\"go('status')\"",'full')}`:btn('Candidatar-me →',"onclick=\"go('resume')\"",'full')}`;
if(screen==='company')out=`${back('detail','Voltar à vaga')}${title('Quem está contratando',j.company)}<section class="panel">${company(j)}<h2>Sobre a empresa</h2><p>Organização demonstrativa do setor de tecnologia, com projetos colaborativos e oportunidades de desenvolvimento profissional.</p><p class="meta">Atuação: ${j.area}<br/>Local: ${j.local}</p><div class="notice">Este perfil utiliza dados fictícios para simular a avaliação da oportunidade.</div>${btn('Voltar à oportunidade',"onclick=\"go('detail')\"",'full')}</section>`;
if(screen==='resume')out=`${back('detail','Voltar à vaga')}<div class="steps" aria-label="Etapa 1 de 3"><span class="step on"></span><span class="step"></span><span class="step"></span></div>${title('Etapa 1 de 3','Seu currículo','Prepare o documento que acompanhará sua candidatura.')}<section class="panel"><h2>Documento profissional</h2><p class="sub">Adicione um PDF ou use o currículo de exemplo para experimentar o fluxo.</p>${state.resume?`<div class="notice"><strong>▤ ${esc(state.resume.name)}</strong><br/>${Math.ceil(state.resume.size/1024)} KB · pronto para revisão</div>`:''}<div class="field"><label for="resume">Selecionar currículo PDF</label><input id="resume" type="file" accept="application/pdf,.pdf" onchange="upload(this.files[0])" aria-describedby="file-help file-error"><p class="hint" id="file-help">Formato PDF, tamanho máximo de 5 MB. O arquivo não é enviado a um servidor.</p><p id="file-error" role="alert" class="${fileError?'notice error':''}">${esc(fileError)}</p></div>${btn('Usar currículo de exemplo',"onclick=\"exampleResume()\"",'secondary full')}<hr class="divider">${btn('Continuar para revisão →',`onclick="go('review')" ${!state.resume?'disabled':''}`,'full')}</section>`;
if(screen==='review')out=`${back('resume','Voltar ao currículo')}<div class="steps" aria-label="Etapa 2 de 3"><span class="step on"></span><span class="step on"></span><span class="step"></span></div>${title('Etapa 2 de 3','Revise sua candidatura','Confira as informações antes de confirmar.')}<section class="panel">${company(j)}<h2>${j.title}</h2><p>${tags(j)}</p><hr class="divider"><p class="meta">Perfil de demonstração</p><strong>${esc(demoName||'Aluno(a)')} · Engenharia de Software</strong><p class="hint">Conta demonstrativa do App Inatel</p><hr class="divider"><div class="row wrap"><div><p class="meta">Currículo selecionado</p><strong>${esc(state.resume?.name||'Nenhum currículo')}</strong></div><button class="textbtn" onclick="go('resume')">Editar</button></div><hr class="divider"><label class="check"><input id="consent" type="checkbox" onchange="document.getElementById('send').disabled=!this.checked">Confirmo os dados e desejo simular o envio deste currículo para esta oportunidade.</label><div class="notice">Demonstração: nenhuma empresa recebe seus dados. Apenas nome e tamanho do arquivo ficam neste navegador.</div><button class="btn full" id="send" onclick="submitApplication()" disabled>Confirmar candidatura</button><p id="send-error" role="alert"></p></section>`;
if(screen==='success')out=`<div class="steps" aria-label="Etapa 3 de 3"><span class="step on"></span><span class="step on"></span><span class="step on"></span></div><section class="panel center"><div class="success" aria-hidden="true">✓</div>${title('Tudo certo','Candidatura enviada!','Mais um passo na direção do seu futuro.')}<p>Sua inscrição para <strong>${j.title}</strong>, na ${j.company}, foi registrada nesta demonstração.</p><p><span class="tag status">Enviada</span></p>${btn('Acompanhar candidatura →',"onclick=\"go('status')\"",'full')}<button class="textbtn" onclick="go('jobs')">Explorar outras vagas</button></section>`;
if(screen==='apps')out=`${title('Cada passo conta','Minhas candidaturas','Acompanhe o andamento das suas inscrições.')}<p class="meta">${state.apps.length} candidatura${state.apps.length===1?'':'s'} registrada${state.apps.length===1?'':'s'}</p>${state.apps.length?[...state.apps].reverse().map(a=>{let k=jobs.find(j=>j.id===a.job);return `<article class="card">${company(k)}<h2>${k.title}</h2><p><span class="tag status ${a.status==='Cancelada'?'cancel':''}">${a.status}</span><span class="meta">${a.date}</span></p><div class="row wrap"><span class="meta">Currículo: ${esc(a.resume)}</span>${btn('Acompanhar →',`onclick="go('status',${k.id},${a.id})"`,'secondary')}</div></article>`}).join(''):`<section class="panel empty"><p class="symbol" aria-hidden="true">◎</p><h2>Seu próximo passo começa aqui</h2><p class="sub">Você ainda não se candidatou. Explore as oportunidades disponíveis.</p>${btn('Encontrar uma vaga',"onclick=\"go('jobs')\"")}</section>`}`;
if(screen==='status'){let record=recordId?state.apps.find(a=>a.id===recordId):[...state.apps].reverse().find(a=>a.job===j.id);out=`${back('apps','Voltar às candidaturas')}${title('Sua trajetória',j.title)}<section class="panel">${company(j)}${record?`<p><span class="tag status ${record.status==='Cancelada'?'cancel':''}">${record.status}</span></p><div class="timeline"><p><strong>Candidatura enviada</strong><br/><span class="meta">${record.date} · ${esc(record.resume)}</span></p>${record.status==='Cancelada'?'<p><strong>Candidatura cancelada</strong><br/><span class="meta">Você encerrou sua participação.</span></p>':'<p><strong>Aguardando avaliação</strong><br/><span class="meta">Não há novas atualizações nesta demonstração.</span></p>'}</div><div class="notice">${record.status==='Cancelada'?'O cancelamento foi concluído. Nenhuma ação adicional é necessária.':'Sua inscrição foi registrada. As próximas etapas dependeriam da análise da empresa no sistema real.'}</div><div class="row stack-mobile">${btn('Ver oportunidade',"onclick=\"go('detail')\"",'secondary')}${record.status!=='Cancelada'?btn('Cancelar candidatura',"onclick=\"cancelDialog()\"",'danger'):''}</div>`:'<p>Nenhuma candidatura para esta vaga.</p>'}</section>`}
$('app').innerHTML=`<div class="screen">${out}</div><p class="support">Projeto acadêmico de IHM · Inatel<br/>Empresas e oportunidades fictícias. Simulação local, sem envio real.</p>`;}
function norm(t){return t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function runSearch(filter=false){query=$('search')?.value.trim()||'';go(filter?'filters':'jobs')}
function clearFilters(){query='';filters={type:'',mode:'',local:''};go('jobs');notify('Busca e filtros removidos.')}
function select(id,label,opts,value){return `<div class="field"><label for="${id}">${label}</label><select id="${id}"><option value="">Todas as opções</option>${opts.map(o=>`<option ${o===value?'selected':''}>${o}</option>`).join('')}</select></div>`}
function applyFilters(){filters={type:$('type').value,mode:$('mode').value,local:$('local').value};go('jobs');notify('Filtros aplicados.')}
function exampleResume(){fileError='';state.resume={name:'curriculo-exemplo.pdf',size:870400};save();render();notify('Currículo de exemplo selecionado.')}
function upload(f){if(!f)return;if(!/\.pdf$/i.test(f.name)||f.type&&f.type!=='application/pdf'){fileError='Selecione um arquivo no formato PDF.';render();return}if(f.size>5*1024*1024){fileError='O PDF ultrapassa 5 MB. Escolha um arquivo menor.';render();return}if(f.size===0){fileError='O arquivo está vazio. Escolha um PDF válido.';render();return}fileError='';state.resume={name:f.name,size:f.size};save();render();notify('Currículo selecionado com sucesso.')}
async function submitApplication(){if(!$('consent')?.checked||!state.resume)return;let j=current();if(!j.active){go('detail');return}if(application(j.id)){go('status');notify('Você já possui uma candidatura ativa para esta vaga.');return}let b=$('send');b.disabled=true;b.textContent='Registrando candidatura…';await new Promise(r=>setTimeout(r,850));state.apps.push({id:Date.now(),job:j.id,date:new Date().toLocaleDateString('pt-BR'),resume:state.resume.name,status:'Enviada'});save();go('success')}
function cancelDialog(){$('modal').innerHTML=`<div class="modalwrap"><section role="dialog" aria-modal="true" aria-labelledby="dialog-title" class="modal"><h2 id="dialog-title">Cancelar candidatura?</h2><p>Você deixará de participar do processo para <strong>${current().title}</strong>.</p>${btn('Manter candidatura',"onclick=\"closeDialog()\"",'full')}${btn('Sim, cancelar',"onclick=\"cancelApplication()\"",'danger full')}</section></div>`;document.querySelector('[role=dialog] button').focus()}
function closeDialog(){$('modal').innerHTML='';document.querySelector('.btn.danger')?.focus()}
function cancelApplication(){let a=application(jobId);if(a)a.status='Cancelada';save();$('modal').innerHTML='';render();notify('Candidatura cancelada com sucesso.')}
document.addEventListener('keydown',e=>{if(!$('modal').innerHTML)return;if(e.key==='Escape'){closeDialog();return}if(e.key==='Tab'){let b=[...document.querySelectorAll('[role=dialog] button')];if(e.shiftKey&&document.activeElement===b[0]){e.preventDefault();b.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===b.at(-1)){e.preventDefault();b[0].focus()}}});
render();
</script></body></html>
